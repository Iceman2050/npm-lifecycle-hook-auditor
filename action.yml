name: "npm Lifecycle Hook Auditor"
description: >-
  Audit npm package lifecycle scripts (preinstall/install/postinstall) for install-time malware: obfuscation, exfiltration patterns, Bun-runtime invocation, and Shai-Hulud markers. Fails CI on HIGH/CRITICAL findings. By Ingenious AI.
author: "Ingenious AI"

branding:
  icon: "package"
  color: "red"

inputs:
  package-json:
    description: Path to package.json, relative to the repository root.
    required: false
    default: "package.json"
  fail-on:
    description: >-
      Comma-separated severities that fail the build (e.g. CRITICAL,HIGH).
    required: false
    default: "CRITICAL,HIGH"

outputs:
  verdict:
    description: Worst severity found (CRITICAL, HIGH, MEDIUM, LOW, INFO, or NONE).
    value: ${{ steps.scan.outputs.verdict }}
  findings-count:
    description: Number of findings.
    value: ${{ steps.scan.outputs.findings-count }}

runs:
  using: "composite"
  steps:
    - name: Run npm Lifecycle Hook Auditor
      id: scan
      shell: bash
      run: |
        set -u
        REPORT="$RUNNER_TEMP/scan-report.json"
        export FAIL_ON="${{ inputs.fail-on }}"
        python3 "${{ github.action_path }}/npm_lifecycle_hook_auditor.py" --package-json "${{ github.workspace }}/${{ inputs.package-json }}" --json > "$REPORT" 2> "$RUNNER_TEMP/scan-stderr.txt" || true
        echo '' | base64 -d > "$RUNNER_TEMP/eval.py"
        python3 "$RUNNER_TEMP/eval.py"
    - name: Fail on findings
      shell: bash
      if: steps.scan.outputs.failed == 'true'
      run: |
        echo "::error::npm Lifecycle Hook Auditor found findings at or above the fail-on threshold."
        exit 1
